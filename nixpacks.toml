# Configuration Nixpacks explicite pour Railway.
# Garantit que le répertoire courant (où se trouvent app/ et innovizer/)
# est dans le PYTHONPATH, ce qui règle "ModuleNotFoundError: No module named 'app'".

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

[variables]
PYTHONPATH = "."
